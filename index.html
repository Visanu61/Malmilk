<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กระดานออเดอร์</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--ink:#14231f;--mute:#5d6b66;--card:#fff;--line:#d3dbd6;--new:#f2a900;--ok:#1f7a5a;--err:#b3382c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1815;--ink:#e8efeb;--mute:#8fa19a;--card:#17241f;--line:#2a3a34;--new:#ffbf2e;--ok:#4cc79a;--err:#ff7d6e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:1.6rem;font-weight:800}
.status{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}.dot.on{background:var(--ok)}.dot.err{background:var(--err)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}.row>div{flex:1 1 120px}.row>.url{flex:4 1 320px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:600;padding:10px 16px;border-radius:6px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.primary{background:var(--ink);color:var(--bg)}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--new);outline-offset:2px}
.stockHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.stockHead h2{margin:0;font-size:1rem;font-weight:800}
.stockHead span{color:var(--mute);font-size:.8rem}
.stock{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sItem{border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:8px;padding:10px 12px;background:var(--bg)}
.sItem.out{border-left-color:var(--err)}
.sName{font-size:.9rem;color:var(--mute);overflow-wrap:anywhere}
.sQty{font-size:1.9rem;font-weight:800;line-height:1.1}
.sItem.out .sQty{color:var(--err)}
.sTag{font-size:.75rem;font-weight:600}
.sItem.out .sTag{color:var(--err)}
.counter{display:flex;align-items:baseline;gap:10px;margin:8px 0 12px}
.counter b{font-size:2.6rem;font-weight:800;line-height:1}.counter span{color:var(--mute)}
.list{display:grid;gap:10px}
.order{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 18px;align-items:start}
.order.fresh{border-left-color:var(--new);animation:pulse 1.2s ease-out 3}
.table{font-size:2rem;font-weight:800;line-height:1.1}
.table small,.meta small{display:block;color:var(--mute);font-size:.75rem;font-weight:400}
.items{white-space:pre-line;font-size:1.1rem;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:.9rem;margin-top:6px}
.meta b{color:var(--ink)}
.done{align-self:center}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.msg{color:var(--err);font-size:.9rem;margin-top:8px;min-height:1.2em}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--new) 70%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.order.fresh{animation:none}}
@media (max-width:560px){.order{grid-template-columns:auto 1fr}.done{grid-column:1/-1}}

.posSum{font-weight:800;font-size:1.1rem;cursor:pointer}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pItem{border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:8px;padding:12px;background:var(--bg)}
.pItem.out{border-left-color:var(--err);opacity:.6}
.pName{font-weight:800;font-size:1.05rem;overflow-wrap:anywhere}
.pPrice{color:var(--mute);font-size:.85rem}
.pStock{font-size:.85rem;color:var(--mute);margin-top:4px}
.pItem.out .pStock{color:var(--err);font-weight:600}
.pStep{display:flex;align-items:center;gap:10px;margin-top:10px}
.pStep button{width:44px;height:44px;padding:0;font-size:1.5rem;line-height:1;border-radius:50%}
.pStep output{min-width:28px;text-align:center;font-size:1.4rem;font-weight:800}
.payRow{display:flex;gap:8px;margin-top:12px}
.payBtn{flex:1}
.payBtn.on{background:var(--ink);color:var(--bg)}
.posTotal{display:flex;justify-content:space-between;align-items:baseline;font-size:1.3rem;font-weight:800;border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.ok{color:var(--ok)}
@media (max-width:420px){.pos{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>กระดานออเดอร์</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">ยังไม่เริ่ม</span></div>
  </header>

  <section class="panel">
    <div class="row">
      <div>
        <label for="sec">เช็กทุกกี่วินาที</label>
        <input type="number" id="sec" min="3" value="5">
      </div>
    </div>
    <div class="btns">
      <button class="primary" id="start">เริ่มรับออเดอร์</button>
      <button id="stop" hidden>หยุด</button>
      <button id="test">ทดสอบเสียง</button>
      <button id="mute">เสียง: เปิด</button>
      <button id="vib">สั่น: เปิด</button>
    </div>
    <div class="msg" id="msg" role="alert"></div>
  </section>

  <section class="panel" id="stockPanel">
    <div class="stockHead"><h2>สต็อกคงเหลือ</h2><span id="stockInfo">ยังไม่โหลด</span></div>
    <div class="stock" id="stock"></div>
  </section>

  <details class="panel" id="posPanel" open>
    <summary class="posSum">หน้าร้าน</summary>
    <div class="pos" id="pos"><div class="empty">กำลังโหลดรายการ...</div></div>
    <div class="payRow">
      <button class="payBtn on" data-pay="เงินสด" aria-pressed="true">💵 เงินสด</button>
      <button class="payBtn" data-pay="เงินโอน" aria-pressed="false">📱 เงินโอน</button>
    </div>
    <div class="posTotal"><span>ยอดรวม</span><span id="pTotal">฿0</span></div>
    <div class="btns" style="margin-top:12px">
      <button class="primary" id="pSend" disabled>บันทึกออเดอร์หน้าร้าน</button>
      <button id="pClear">ล้างรายการ</button>
    </div>
    <div class="msg" id="pMsg" role="status"></div>
  </details>

  <div class="counter"><b id="count">0</b><span>ออเดอร์รอส่ง · ใหม่ในรอบนี้ <strong id="newCount">0</strong></span></div>
  <div class="list" id="list"><div class="empty">กด “เริ่มรับออเดอร์” เพื่อเริ่มดึงข้อมูล</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
let vibOn = true, wake = null, keep = null, worker = null, timer = null, seen = new Set(), first = true, muted = false, ctx = null, newTotal = 0;
const baseTitle = document.title;

try{ $('sec').value = localStorage.getItem('sheetSec') || 5; }catch(e){}

function audio(){
  if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state === 'suspended') ctx.resume();
  if(!keep){
    keep = ctx.createOscillator(); const g = ctx.createGain(); g.gain.value = 0.0001;
    keep.connect(g); g.connect(ctx.destination); keep.start();
  }
  return ctx;
}
function chime(){
  if(muted) return;
  const c = audio(), t0 = c.currentTime;
  [[880,0],[1175,.22],[880,.6],[1175,.82]].forEach(([f,d])=>{
    const o = c.createOscillator(), g = c.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+d);
    g.gain.linearRampToValueAtTime(.65,t0+d+.02);
    g.gain.exponentialRampToValueAtTime(.001,t0+d+.35);
    o.connect(g); g.connect(c.destination); o.start(t0+d); o.stop(t0+d+.4);
  });
}

function buzz(){ if(vibOn && navigator.vibrate) navigator.vibrate([400,150,400]); }
async function keepAwake(){
  try{ if('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } }catch(e){}
}
const keyOf = o => o.row + '|' + o.time + '|' + o.items;
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRKJnxZk0h2Ve0avffRED6IYyuZ6Bq7Tfs_jzpVc_kXd_dtLIYqzI4XyR9MRJZ6e4OIA/exec';
const base = () => SCRIPT_URL;
const api = q => base() + '?' + q + '&_=' + Date.now();
const fmtTime = v => { const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); };

async function loadStock(){
  try{
    const res = await fetch(api('action=getStock'), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const rows = JSON.parse(await res.text());
    if(!Array.isArray(rows)) throw new Error(rows && rows.error ? rows.error : 'รูปแบบไม่ถูกต้อง');
    renderStock(rows);
    $('stockInfo').textContent = 'อัปเดต ' + new Date().toLocaleTimeString('th-TH');
  }catch(err){
    $('stockInfo').textContent = 'โหลดสต็อกไม่ได้: ' + err.message + ' (ตรวจว่าเพิ่ม action=getStock ใน Apps Script และ Deploy เวอร์ชันใหม่แล้ว)';
  }
}

function renderStock(rows){
  posSetMenu(rows);
  const box = $('stock'); box.innerHTML = '';
  rows.forEach(r => {
    const name = r.name ?? r.flavor ?? '-';
    const qty = Number(r.qty ?? r.stock ?? 0) || 0;
    const el = document.createElement('div');
    el.className = 'sItem' + (qty <= 0 ? ' out' : '');
    const n = document.createElement('div'); n.className = 'sName'; n.textContent = name;
    const q = document.createElement('div'); q.className = 'sQty'; q.textContent = qty;
    el.append(n, q);
    if(qty <= 0){
      const t = document.createElement('div'); t.className = 'sTag'; t.textContent = 'หมด';
      el.append(t);
    }
    box.appendChild(el);
  });
}

async function check(){
  loadStock();
  try{
    const res = await fetch(api('action=getNewOrders'), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.text();
    let rows;
    try{ rows = JSON.parse(raw); }catch(e){ throw new Error('ไม่ใช่ข้อมูล JSON'); }
    if(!Array.isArray(rows)) throw new Error(rows && rows.error ? rows.error : 'ข้อมูลไม่ถูกรูปแบบ');
    const fresh = new Set();
    rows.forEach(o => { const k = keyOf(o); if(!seen.has(k)){ seen.add(k); if(!first) fresh.add(k); } });
    render(rows, fresh);
    const mine = Math.min(fresh.size, selfAdded); selfAdded -= mine;
    const theirs = fresh.size - mine;
    if(theirs){
      newTotal += theirs; $('newCount').textContent = newTotal;
      chime(); buzz();
      if(ctx && ctx.state !== 'running') $('msg').textContent = 'เบราว์เซอร์บล็อกเสียงอยู่ — กด “ทดสอบเสียง” หนึ่งครั้ง แล้วลองใหม่';
      document.title = '🔔 (' + newTotal + ') ออเดอร์ใหม่';
    }
    first = false;
    setStatus('on', 'เชื่อมต่อแล้ว · อัปเดต ' + new Date().toLocaleTimeString('th-TH'));
    $('msg').textContent = '';
  }catch(err){
    setStatus('err', 'เชื่อมต่อไม่ได้');
    $('msg').textContent = 'ดึงข้อมูลไม่สำเร็จ: ' + err.message + ' — ตรวจว่า Deploy เป็น Web app (Who has access: Anyone) และกด New version หลังแก้โค้ด';
  }
}

function render(rows, fresh){
  $('count').textContent = rows.length;
  const list = $('list'); list.innerHTML = '';
  if(!rows.length){ list.innerHTML = '<div class="empty">ไม่มีออเดอร์ค้างส่ง</div>'; return; }
  rows.slice().reverse().forEach(o=>{
    const el = document.createElement('div');
    el.className = 'order' + (fresh.has(keyOf(o)) ? ' fresh' : '');
    const t = document.createElement('div'); t.className = 'table';
    t.innerHTML = '<small>โต๊ะ</small>'; t.append(document.createTextNode(o.table || '-'));
    const mid = document.createElement('div');
    const it = document.createElement('div'); it.className = 'items'; it.textContent = o.items || '-';
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.append(document.createTextNode(fmtTime(o.time) + ' · ยอด '));
    const b = document.createElement('b'); b.textContent = o.total; meta.append(b);
    meta.append(document.createTextNode(' · ' + (o.pay || '-')));
    mid.append(it, meta);
    const btn = document.createElement('button'); btn.className = 'done primary'; btn.textContent = 'ส่งแล้ว';
    btn.onclick = () => markDone(o.row, btn);
    el.append(t, mid, btn); list.appendChild(el);
  });
}

async function markDone(row, btn){
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try{
    const res = await fetch(api('action=markDone&row=' + row));
    const r = await res.json();
    if(!r.success) throw new Error('บันทึกไม่สำเร็จ');
    await check();
  }catch(err){ btn.disabled = false; btn.textContent = 'ส่งแล้ว'; $('msg').textContent = err.message; }
}

function startTimer(sec){
  try{
    const src = 'setInterval(()=>postMessage(1),' + sec*1000 + ')';
    worker = new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
    worker.onmessage = check; worker.onerror = () => { stopTimer(); timer = setInterval(check, sec*1000); };
  }catch(e){ timer = setInterval(check, sec*1000); }
}
function stopTimer(){ if(worker){ worker.terminate(); worker = null; } clearInterval(timer); timer = null; }

function setStatus(cls, txt){ $('dot').className = 'dot ' + cls; $('statusTxt').textContent = txt; }

$('start').onclick = () => {
  const sec = Math.max(3, +$('sec').value || 5);
  try{ localStorage.setItem('sheetSec', sec); }catch(e){}
  audio(); keepAwake(); buzz();
  stopTimer(); selfAdded = 0; seen.clear(); first = true; newTotal = 0; $('newCount').textContent = 0;
  document.title = baseTitle; setStatus('', 'กำลังเชื่อมต่อ...');
  check(); startTimer(sec);
  $('start').textContent = 'เริ่มใหม่'; $('stop').hidden = false;
};
$('stop').onclick = () => { stopTimer(); setStatus('', 'หยุดแล้ว'); $('stop').hidden = true; };
$('test').onclick = () => { const m = muted; muted = false; chime(); muted = m; buzz(); };
$('vib').onclick = () => {
  vibOn = !vibOn; $('vib').textContent = 'สั่น: ' + (vibOn ? 'เปิด' : 'ปิด');
  if(vibOn && !navigator.vibrate) $('msg').textContent = 'อุปกรณ์/เบราว์เซอร์นี้ไม่รองรับการสั่น (iPhone ไม่รองรับ)';
};
$('mute').onclick = () => { muted = !muted; $('mute').textContent = 'เสียง: ' + (muted ? 'ปิด' : 'เปิด'); };
document.addEventListener('visibilitychange', () => { if(!document.hidden){ document.title = baseTitle; if(timer || worker) keepAwake(); } });

/* ===== ออเดอร์หน้าร้าน ===== */
const SHOP_NAME = 'หน้าร้าน';
const PRICES = {'น้ำผึ้ง':25, 'ออริจินอล':20, 'สตรอว์เบอร์รี่':25, 'มะพร้าว':25};
let menu = [], cart = {}, posPay = 'เงินสด', posBusy = false, selfAdded = 0, menuSig = '';
const priceOf = name => PRICES[name] || 0;
const running = () => !!(timer || worker);

function posSetMenu(rows){
  menu = rows.map(r => ({ name: String(r.name ?? r.flavor ?? '-'), qty: Number(r.qty ?? r.stock ?? 0) || 0 }));
  const sig = JSON.stringify(menu);
  if(sig === menuSig) return;
  menuSig = sig;
  posRender();
}

function posRender(){
  const box = $('pos'); box.innerHTML = '';
  menu.forEach(m => {
    const out = m.qty <= 0;
    if((cart[m.name] || 0) > m.qty){ if(m.qty > 0) cart[m.name] = m.qty; else delete cart[m.name]; }
    const n = cart[m.name] || 0;
    const el = document.createElement('div'); el.className = 'pItem' + (out ? ' out' : '');
    const nm = document.createElement('div'); nm.className = 'pName'; nm.textContent = m.name;
    const pr = document.createElement('div'); pr.className = 'pPrice'; pr.textContent = '฿' + priceOf(m.name) + ' / ถ้วย';
    const sk = document.createElement('div'); sk.className = 'pStock';
    sk.textContent = out ? 'หมด' : 'คงเหลือ ' + (m.qty - n) + ' ถ้วย';
    el.append(nm, pr, sk);
    if(!out){
      const st = document.createElement('div'); st.className = 'pStep';
      const minus = document.createElement('button'); minus.textContent = '−'; minus.setAttribute('aria-label', 'ลด ' + m.name);
      const o = document.createElement('output'); o.textContent = n;
      const plus = document.createElement('button'); plus.textContent = '+'; plus.setAttribute('aria-label', 'เพิ่ม ' + m.name);
      minus.disabled = n <= 0; plus.disabled = n >= m.qty;
      minus.onclick = () => posChange(m.name, -1, m.qty); plus.onclick = () => posChange(m.name, 1, m.qty);
      st.append(minus, o, plus); el.append(st);
    }
    box.appendChild(el);
  });
  posSum();
}

function posChange(name, d, max){
  const n = Math.max(0, Math.min(max, (cart[name] || 0) + d));
  if(n) cart[name] = n; else delete cart[name];
  posRender();
}

function posTotals(){
  let qty = 0, price = 0;
  Object.entries(cart).forEach(([k, n]) => { qty += n; price += n * priceOf(k); });
  return { qty, price };
}
function posSum(){
  const t = posTotals();
  $('pTotal').textContent = '฿' + t.price;
  $('pSend').disabled = posBusy || t.qty === 0;
}

document.querySelectorAll('.payBtn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.payBtn').forEach(x => { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); });
  b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); posPay = b.dataset.pay;
});

$('pClear').onclick = () => { cart = {}; $('pMsg').textContent = ''; posRender(); };

$('pSend').onclick = async () => {
  const pm = $('pMsg'); pm.className = 'msg';
  const lines = Object.entries(cart).filter(([, n]) => n > 0);
  if(!lines.length) return;
  const payload = {
    table: SHOP_NAME,
    itemText: lines.map(([k, n]) => k + ' x' + n).join('\n'),
    items: lines.map(([name, qty]) => ({ name, qty })),
    total: posTotals().price,
    pay: posPay
  };
  posBusy = true; $('pSend').textContent = 'กำลังบันทึก...'; $('pSend').disabled = true; pm.textContent = '';
  const counted = running(); if(counted) selfAdded++;
  try{
    const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
    const r = JSON.parse(await res.text());
    if(!r.success) throw new Error(r.error || 'บันทึกไม่สำเร็จ');
    cart = {};
    pm.className = 'msg ok'; pm.textContent = 'บันทึกแล้ว: ' + payload.itemText.replace(/\n/g, ' · ') + ' · ฿' + payload.total;
    await check();
  }catch(err){
    if(counted) selfAdded = Math.max(0, selfAdded - 1);
    pm.textContent = 'บันทึกไม่สำเร็จ: ' + err.message + ' — ลองกดอีกครั้ง';
  }finally{
    posBusy = false; $('pSend').textContent = 'บันทึกออเดอร์หน้าร้าน'; posRender();
  }
};

loadStock();
</script>
</body>
</html>
